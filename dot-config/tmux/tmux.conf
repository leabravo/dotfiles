set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set-environment -g COLORTERM "truecolor"
set -g set-clipboard on

set -g mouse on
set -g focus-events on
set -s escape-time 10
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -s "bg=#1e1e2e,fg=#cdd6f4" -S "fg=#f5c2e7,bg=#1e1e2e" -E "env TERM=tmux-256color COLORTERM=truecolor lazygit"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#f5c2e7,bold] #I:#W #[fg=#f5c2e7,bg=#181825,nobold]"

set -g status-left-length 40
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#181825,nobold] "
set -g status-right-length 100
set -g status-right "#[fg=#6c7086] %H:%M #[fg=#11111b,bg=#f5c2e7,bold] #h "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#f5c2e7"
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#f5c2e7,bg=#1e1e2e"
set -g popup-border-lines "rounded"
set -g message-style "bg=#f5c2e7,fg=#11111b,bold"
